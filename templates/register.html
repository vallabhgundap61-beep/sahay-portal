{% extends "base.html" %}
{% block title %}Sahay — Sign Up{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="text-center mb-8">
        <div class="w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-md mx-auto mb-4">
            <i class="fa-solid fa-shield-halved text-xl"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900">Create your account</h1>
        <p class="text-slate-500 text-sm mt-1">Join Sahay to report issues and support your community.</p>
    </div>

    {% if error %}
    <div class="bg-rose-50 border border-rose-200 text-rose-700 rounded-xl px-4 py-3 mb-6 text-sm font-medium flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="bg-white border border-slate-200 rounded-2xl p-8 shadow-xs flex flex-col gap-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label class="block font-bold text-slate-700 mb-2 text-sm">Full Name</label>
            <input type="text" name="name" required autocomplete="name"
                   class="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>

        <div>
            <label class="block font-bold text-slate-700 mb-2 text-sm">Email</label>
            <input type="email" name="email" required autocomplete="email"
                   class="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>

        <div>
            <label class="block font-bold text-slate-700 mb-2 text-sm">Password</label>
            <input type="password" name="password" required autocomplete="new-password" minlength="8"
                   class="w-full px-4 py-3 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
            <p class="text-xs text-slate-400 mt-1">At least 8 characters.</p>
        </div>

        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/30 transition">
            Create Account
        </button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
        Already have an account? <a href="{{ url_for('login') }}" class="text-blue-600 font-bold hover:underline">Log in</a>
    </p>
</div>
{% endblock %}
